<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A playful apology microsite with a tiny interaction loop." />
    <title>One More Chance?</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11131a;
        --panel: rgba(29, 33, 46, 0.82);
        --ink: #f7f4ef;
        --muted: #a7aab5;
        --accent: #ff7a90;
        --accent-strong: #ff5574;
        --line: rgba(255, 255, 255, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 122, 144, 0.16), transparent 32rem),
          radial-gradient(circle at 85% 85%, rgba(119, 103, 255, 0.12), transparent 28rem),
          var(--bg);
      }

      main {
        width: min(92vw, 620px);
        padding: 3rem 1.5rem;
      }

      .card {
        position: relative;
        padding: clamp(2rem, 7vw, 4.5rem);
        overflow: hidden;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2rem;
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .card::before {
        position: absolute;
        inset: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 1.4rem;
        content: "";
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .emoji {
        display: block;
        margin-bottom: 1.25rem;
        font-size: clamp(3rem, 10vw, 5rem);
        filter: drop-shadow(0 0.6rem 1rem rgba(255, 122, 144, 0.25));
      }

      h1 {
        max-width: 10ch;
        margin: 0 auto 1rem;
        font-size: clamp(2.3rem, 8vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 34rem;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem;
        margin-top: 2.25rem;
      }

      button {
        min-width: 9.5rem;
        padding: 0.85rem 1.1rem;
        color: var(--ink);
        font: inherit;
        font-weight: 750;
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      button:focus-visible {
        outline: 3px solid rgba(255, 122, 144, 0.5);
        outline-offset: 4px;
      }

      #accept {
        background: var(--accent-strong);
        border-color: transparent;
      }

      #accept:hover { background: var(--accent); transform: translateY(-2px); }

      #reject {
        background: rgba(255, 255, 255, 0.04);
      }

      #reject:hover { border-color: rgba(255, 255, 255, 0.25); }

      .note {
        min-height: 1.5rem;
        margin-top: 1.35rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 480px) {
        .card { padding: 2.25rem 1.25rem; }
        .actions { align-items: stretch; flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">A small interaction experiment</p>
        <span class="emoji" aria-hidden="true">🥺</span>
        <h1 id="title">Can we start over?</h1>
        <p id="message">I made a tiny mistake. One honest apology, coming right up.</p>

        <div class="actions">
          <button id="accept" type="button">Okay, fine ❤️</button>
          <button id="reject" type="button">Not yet</button>
        </div>

        <p class="note" id="note" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const acceptButton = document.querySelector("#accept");
      const rejectButton = document.querySelector("#reject");
      const message = document.querySelector("#message");
      const note = document.querySelector("#note");
      const card = document.querySelector(".card");

      const nudges = [
        "I understand. I’ll give you a second.",
        "That is fair. I’m still rooting for us.",
        "Okay, okay… one last tiny plea?",
        "I’ll be over here practicing my apology."
      ];

      let attempts = 0;

      rejectButton.addEventListener("click", () => {
        attempts += 1;
        const scale = Math.max(0.64, 1 - attempts * 0.09);
        rejectButton.style.transform = `scale(${scale})`;
        note.textContent = nudges[Math.min(attempts - 1, nudges.length - 1)];

        if (attempts >= nudges.length) {
          rejectButton.textContent = "Maybe later";
        }
      });

      acceptButton.addEventListener("click", () => {
        card.innerHTML = `
          <p class="eyebrow">Resolution unlocked</p>
          <span class="emoji" aria-hidden="true">✨</span>
          <h1 id="title">Thank you.</h1>
          <p>That’s all I wanted. I’ll try to do better next time.</p>
        `;
      });
    </script>
  </body>
</html>
